<section class="lab-section" id="labs">
  <header class="header">
    <span class="section-kicker">DIAGNOSTICS</span>
    <h2 class="lab-title">Laboratory Services</h2>
    <p class="section-subtitle">Accurate and fast diagnostic testing</p>
    <div class="section-line"></div>
  </header>

  <mat-tab-group>

    <!-- BLOOD TESTS -->
    <mat-tab label="Blood Tests">
      <div class="grid">
        <mat-card class="lab-card"
          *ngFor="let s of labServices.filter(x => x.category === 'blood')">

          <mat-card-title>{{ s.name }}</mat-card-title>

          <mat-card-content>
            <p>{{ s.description }}</p>
          </mat-card-content>

        </mat-card>
      </div>
    </mat-tab>

    <!-- URINE TESTS -->
    <mat-tab label="Urine Tests">
      <div class="grid">
        <mat-card class="lab-card"
          *ngFor="let s of labServices.filter(x => x.category === 'urine')">

          <mat-card-title>{{ s.name }}</mat-card-title>

          <mat-card-content>
            <p>{{ s.description }}</p>
          </mat-card-content>

        </mat-card>
      </div>
    </mat-tab>

    <!-- STOOL TESTS -->
    <mat-tab label="Stool Tests">
      <div class="grid">
        <mat-card class="lab-card"
          *ngFor="let s of labServices.filter(x => x.category === 'stool')">

          <mat-card-title>{{ s.name }}</mat-card-title>

          <mat-card-content>
            <p>{{ s.description }}</p>
          </mat-card-content>

        </mat-card>
      </div>
    </mat-tab>

  </mat-tab-group>

</section>
