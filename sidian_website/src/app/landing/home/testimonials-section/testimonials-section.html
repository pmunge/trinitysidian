<div class="health-tips">
  <header class="section-header">
    <span class="section-kicker">HEALTH TIPS</span>
    <h2 class="section-heading">Health Tips</h2>
    <div class="section-line"></div>
  </header>

  <section class="tip-1">
    <!-- NO h3 here anymore -->
    <div class="image-container">
      <img *ngIf="testimonials[0]?.image1" [src]="'/' + testimonials[0].image1" [alt]="testimonials[0]?.title">
      <div class="inner-card">
        <img *ngIf="testimonials[0]?.image2" [src]="'/' + testimonials[0].image2" [alt]="testimonials[0]?.title">
      </div>
    </div>
    <div class="text-container">
      <h3>{{ testimonials[0]?.title }}</h3>
      <p>{{ testimonials[0]?.description }}</p>
    </div>
  </section>

  <section class="tip-2">
    <div class="image-container">
      <img *ngIf="testimonials[1]?.image1" [src]="'/' + testimonials[1].image1" [alt]="testimonials[1]?.title">
      <div class="inner-card">
        <img *ngIf="testimonials[1]?.image2" [src]="'/' + testimonials[1].image2" [alt]="testimonials[1]?.title">
      </div>
    </div>
    <div class="text-container">
      <h3>{{ testimonials[1]?.title }}</h3>
      <p>{{ testimonials[1]?.description }}</p>
    </div>
  </section>
</div>
