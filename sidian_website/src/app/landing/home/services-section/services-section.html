<section class="services" id="services">
  <div class="container">
    <header class="heading">
      <span class="section-kicker">OUR SERVICES</span>
      <h2 class="service-heading">{{ sectionTitle }}</h2>
      <p class="section-subtitle" *ngIf="sectionSubtitle">{{ sectionSubtitle }}</p>
      <div class="section-line"></div>
    </header>

    <div class="services-layout">
      <div class="cards-column">
        <div class="service-card" *ngFor="let service of services.slice(0,2)">
          <h4 class="card_id">{{service.id}}</h4>
          <h5 class="card-title">{{ service.title }}</h5>
          <p class="card-text">{{ service.description }}</p>
        </div>
      </div>

      <div class="center-image">
        <img [src]="centerImageUrl" alt="Services" />
      </div>

      <div class="cards-column">
        <div class="service-card" *ngFor="let service of services.slice(2,4)">
          <h4 class="card_id">{{service.id}}</h4>
          <h5 class="card-title">{{ service.title }}</h5>
          <p class="card-text">{{ service.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
