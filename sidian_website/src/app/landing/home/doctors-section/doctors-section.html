<section class="doctors" id="doctors">
  <div class="container">
    <header class="heading">
      <div class="heading-copy">
        <span class="section-kicker">OUR TEAM</span>
        <h2 class="service-heading">Meet Our Team</h2>
        <div class="section-line"></div>
      </div>
      <div class="carousel-controls">
        <button type="button" class="carousel-btn" (click)="scrollCarousel('left')" aria-label="Scroll left">←</button>
        <button type="button" class="carousel-btn" (click)="scrollCarousel('right')" aria-label="Scroll right">→</button>
      </div>
    </header>

    <div class="cards-row" #cardsRow>
      <article class="doctor-card" *ngFor="let doctor of doctors">
        <img class="doctor-image" [src]="doctor.image" [alt]="doctor.name" />
        <div class="card-body">
          <h5 class="card-title">{{ doctor.name }}</h5>
          <p class="card-text">{{ doctor.speciality }}</p>
          <p class="card-contact">{{ doctor.contact }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
